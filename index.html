<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="to do list JS learning">
  <meta name="keywords" content="to do list">
  <meta http-equiv="refresh" content="">
  <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
  <title>to do list</title>
  <!-- bootstrap -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <!-- bootstrap rtl -->
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet"> -->
  <!-- my css -->
  <link rel="stylesheet" href="css/style.css">
  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

  <header class="d-flex justify-content-between align-items-center container  p-2 my-1">
    <h1 class="text-center">Notes</h1>
    <div class="search-box">
      <input type="text"id="searchInput" placeholder="search note...">
      <i class="fa fa-search"></i>
    </div>
  </header>
  
  <div class="container  text-center d-flex justify-content-start p-2">
      <textarea name="" id="noteInput"class="w-100 mx-1" placeholder="Write your note here..."></textarea>
      <button id="addNoteBtn" class="btn btn-success">Save Note</button>
  </div>


  <div class="container  my-1 p-2 ">
      <div id="notesList">
        
      </div>
  </div>


  




  <!-- myh1java file -->
  <script src="js/myjs.js"></script>

  <!-- bootstrap js -->
  <script src="js/bootstrap.bundle.min.js"></script>


</body>

</html>
